services:
  - type: web
    name: clarity-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: ANTHROPIC_API_KEY
        sync: false   # optional: set in the Render dashboard to turn on AI commentary
